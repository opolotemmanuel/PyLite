name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Check installed commands
        run: python tests/installed_smoke.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run demo
        run: python -m pylite run examples/demo.lite

      - name: Run unit tests without debug ranges
        if: ${{ matrix.python-version != '3.10' }}
        run: python -X no_debug_ranges -m unittest discover -s tests -v
